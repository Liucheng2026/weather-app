<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff5f6">
  <meta name="description" content="一个藏着小小心意的情人节告白。">
  <title>给你的一封情书 💌</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #473b57;
      --muted: #96889e;
      --pink: #ee7897;
      --pink-dark: #d9547b;
      --lavender: #9c8bd7;
      --paper: #fffaf8;
    }

    * { box-sizing: border-box; }

    html { min-width: 320px; min-height: 100%; }

    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      overflow-x: hidden;
      background:
        radial-gradient(ellipse at 50% 4%, rgb(255 255 255 / 90%), transparent 48%),
        linear-gradient(160deg, #fff5f6 0%, #f8f2ff 55%, #f2f1ff 100%);
      color: var(--ink);
      font: 15px/1.55 ui-rounded, "SF Pro Rounded", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button { font: inherit; }

    .page {
      position: relative;
      display: grid;
      min-height: 100vh;
      min-height: 100svh;
      place-items: center;
      padding: 34px 18px;
      isolation: isolate;
    }

    #fireworks {
      position: fixed;
      z-index: -1;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .letter {
      width: min(100%, 590px);
      text-align: center;
    }

    .kicker {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin: 0 0 12px;
      color: var(--pink-dark);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .kicker::before, .kicker::after {
      width: 18px;
      height: 1px;
      background: #eab1c1;
      content: "";
    }

    h1 {
      margin: 0;
      font-family: "STKaiti", "KaiTi", "Kaiti SC", "PingFang SC", serif;
      font-size: clamp(29px, 7vw, 42px);
      font-weight: 650;
      letter-spacing: .06em;
      line-height: 1.3;
    }

    .subtitle {
      margin: 10px 0 20px;
      color: var(--muted);
      font-size: 14px;
    }

    .scene {
      position: relative;
      overflow: hidden;
      width: 100%;
      aspect-ratio: 1.62;
      min-height: 230px;
      border: 1px solid rgb(255 255 255 / 85%);
      border-radius: 27px;
      background: linear-gradient(180deg, #f8e9fa 0%, #fbeef3 49%, #e8e4f6 100%);
      box-shadow: 0 20px 60px rgb(102 74 119 / 13%), inset 0 1px rgb(255 255 255 / 90%);
      isolation: isolate;
    }

    .scene::before {
      position: absolute;
      top: 10%;
      left: 12%;
      width: 52px;
      aspect-ratio: 1;
      border-radius: 50%;
      background: #fff7da;
      box-shadow: 0 0 42px 12px rgb(255 243 190 / 50%);
      content: "";
    }

    .scene::after {
      position: absolute;
      inset: auto 0 0;
      height: 29%;
      background: linear-gradient(180deg, #e1e6d9, #d6e0d1);
      content: "";
    }

    .horizon {
      position: absolute;
      right: -3%;
      bottom: 24%;
      left: -3%;
      height: 25%;
      border-radius: 50% 50% 0 0 / 40% 40% 0 0;
      background: #ede8f1;
    }

    .scene-art {
      position: absolute;
      z-index: 1;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .stars {
      position: absolute;
      z-index: 1;
      color: #fffdf6;
      animation: twinkle 2.8s ease-in-out infinite alternate;
    }

    .star-one { top: 14%; left: 33%; font-size: 19px; }
    .star-two { top: 28%; right: 12%; font-size: 14px; animation-delay: .8s; }
    .star-three { top: 9%; right: 32%; font-size: 11px; animation-delay: 1.3s; }

    .boy-standing {
      transform-box: fill-box;
      transform-origin: center bottom;
      animation: standAway 1.5s cubic-bezier(.5, 0, .35, 1) 1.05s both;
    }

    .boy-kneeling {
      opacity: 0;
      transform-box: fill-box;
      transform-origin: center bottom;
      animation: kneelIn 1.1s cubic-bezier(.2, .75, .2, 1) 1.45s both;
    }

    .bouquet {
      opacity: 0;
      transform-box: fill-box;
      transform-origin: center;
      animation: flowersArrive .8s ease-out 2.05s both;
    }

    .heart-float {
      opacity: 0;
      animation: floatHeart 2.7s ease-out 2.4s infinite;
    }

    .heart-float.second { animation-delay: 3.2s; }

    .question {
      margin: 22px 0 15px;
      opacity: 0;
      transform: translateY(9px);
      animation: reveal .8s ease 3.25s forwards;
    }

    .question h2 {
      margin: 0;
      color: #4a3c59;
      font-family: "STKaiti", "KaiTi", "Kaiti SC", "PingFang SC", serif;
      font-size: clamp(25px, 6vw, 34px);
      font-weight: 700;
      letter-spacing: .04em;
    }

    .question p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .answers {
      display: flex;
      justify-content: center;
      gap: 12px;
      opacity: 0;
      transform: translateY(8px);
      animation: reveal .8s ease 3.55s forwards;
    }

    .answer {
      min-height: 48px;
      padding: 0 22px;
      border: 1px solid #f1cfda;
      border-radius: 15px;
      background: rgb(255 255 255 / 76%);
      color: var(--pink-dark);
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
      transition: transform .2s, box-shadow .2s, background .2s;
      -webkit-tap-highlight-color: transparent;
    }

    .answer:hover { transform: translateY(-2px); box-shadow: 0 8px 18px rgb(216 96 132 / 16%); }
    .answer:active { transform: scale(.97); }
    .answer:focus-visible { outline: 3px solid #ef91ad; outline-offset: 3px; }

    .answer.primary {
      border-color: transparent;
      background: linear-gradient(135deg, #f28aa7, #df668c);
      color: white;
      box-shadow: 0 8px 18px rgb(222 102 140 / 24%);
    }

    .answer.primary:hover { box-shadow: 0 11px 22px rgb(222 102 140 / 33%); }

    .thanks {
      display: none;
      margin: 20px 0 4px;
      color: var(--pink-dark);
      font-family: "STKaiti", "KaiTi", "Kaiti SC", "PingFang SC", serif;
      font-size: clamp(27px, 6vw, 36px);
      font-weight: 700;
      letter-spacing: .06em;
    }

    .letter.accepted .question { display: none; }
    .letter.accepted .answers { display: none; }
    .letter.accepted .thanks { display: block; animation: reveal .65s ease both; }
    .letter.accepted .subtitle { display: none; }

    .signature {
      margin: 20px 0 0;
      color: #a698ae;
      font-size: 11px;
      letter-spacing: .07em;
    }

    @keyframes standAway {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      68% { opacity: 1; transform: translateY(2px) scale(1.015); }
      100% { opacity: 0; transform: translateY(4px) scale(.98); }
    }

    @keyframes kneelIn {
      0% { opacity: 0; transform: translateY(-16px) scale(.96); }
      70% { opacity: 1; transform: translateY(2px) scale(1.01); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes flowersArrive {
      from { opacity: 0; transform: translateY(-30px) scale(.68) rotate(-12deg); }
      to { opacity: 1; transform: translateY(0) scale(1) rotate(0); }
    }

    @keyframes floatHeart {
      0% { opacity: 0; transform: translateY(9px) scale(.7) rotate(-8deg); }
      15% { opacity: .8; }
      75% { opacity: .65; }
      100% { opacity: 0; transform: translateY(-55px) scale(1.12) rotate(12deg); }
    }

    @keyframes twinkle {
      from { opacity: .5; transform: scale(.86); }
      to { opacity: 1; transform: scale(1.12); }
    }

    @keyframes reveal {
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 450px) {
      .page { padding: 26px 15px; }
      .kicker { margin-bottom: 8px; }
      .subtitle { margin: 7px 0 15px; }
      .scene { min-height: 210px; border-radius: 22px; }
      .question { margin-top: 18px; }
      .answer { min-height: 46px; padding: 0 17px; }
    }

    @media (max-height: 720px) and (min-width: 451px) {
      .page { padding-block: 20px; }
      .subtitle { margin-block: 6px 12px; }
      .scene { max-height: 42vh; }
      .question { margin-block: 13px 10px; }
      .signature { margin-top: 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-delay: 0ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }

      .boy-standing { opacity: 0; }
      .boy-kneeling, .bouquet { opacity: 1; }
      .question, .answers { opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <canvas id="fireworks" aria-hidden="true"></canvas>
  <main class="page">
    <article class="letter" id="letter">
      <p class="kicker">A little something for you</p>
      <h1>给你的一封情书</h1>
      <p class="subtitle">有些心意，想认真地告诉你。</p>

      <section class="scene" role="img" aria-label="夕阳下，动漫男孩单膝跪地，把鲜花送给动漫女孩">

        <span class="stars star-two" aria-hidden="true">✧</span>
        <span class="stars star-three" aria-hidden="true">✦</span>
        <svg class="scene-art" viewBox="0 0 760 460" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">

            <path d="M518 168c5-32 13-38 27-44 20 9 36 8 52-2 10 14 9 34 9 47-8-4-13-15-16-25-18 15-42 21-72 24Z" fill="url(#girlHair)"/>

            <path d="m504 105-23-15 3 28 21 5m81-29 19-17 1 27-22 8" fill="#D78DB2"/>
            <path d="M528 181c4-5 10-5 14 0m18 0c4-5 10-5 14 0" stroke="#584657" stroke-width="3.5" stroke-linecap="round"/>
            <path d="m548 188-2 7 4 1" stroke="#D59A92" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

            <ellipse cx="526" cy="193" rx="7" ry="3.5" fill="#F49BA9" fill-opacity=".65"/>
            <ellipse cx="574" cy="193" rx="7" ry="3.5" fill="#F49BA9" fill-opacity=".65"/>
            <path d="M523 226c-7 10-13 22-18 35l-20 76c-4 13 1 21 10 18l27-59 13 90h68l8-96c8 28 20 54 28 56 10 2 14-7 9-18l-27-74c-9-19-20-29-36-35l-32 9-30-2Z" fill="url(#dress)"/>
            <path d="m524 227 24 19 27-20-7 29-23 13-23-14-7-27Z" fill="#FFF1F1"/>
            <path d="m523 294 24-17 26 18" stroke="#D96F96" stroke-opacity=".42" stroke-width="3"/>
            <path d="M527 384h21m27 0h19" stroke="#795A75" stroke-width="8" stroke-linecap="round"/>
            <path d="M527 384v-17m47 17v-17" stroke="#FFE0D2" stroke-width="9" stroke-linecap="round"/>
            <path d="M525 373h23m25 0h22" stroke="#F3D0C6" stroke-width="3" stroke-linecap="round"/>
          </g>

          <!-- Standing pose fades as he kneels. -->
          <g class="boy-standing">
            <path d="M259 204c-4-26 8-44 29-45 21-1 35 15 32 42l-4 24h-53l-4-21Z" fill="url(#boyHair)"/>

          <!-- Kneeling pose and the little bouquet on the grass. -->

            <path d="m227 304 23 47m-14-54 15 54m-4-60 1 58" stroke="#638D6B" stroke-width="3" stroke-linecap="round"/>

            <circle cx="221" cy="295" r="10" fill="#F18BAB"/>

      </section>

      <section class="question" aria-live="polite">
        <h2>你愿意做我的女朋友吗？</h2>
        <p>从今天开始，把每一个普通日子都变成喜欢的样子。</p>
      </section>
      <div class="answers" id="answers">
        <button class="answer" type="button">我愿意 ♡</button>
        <button class="answer primary" type="button">我非常愿意！</button>
      </div>
      <p class="thanks" id="thanks" role="status">谢谢你，最美的女孩 ♡</p>
      <p class="signature">Made with a little courage &amp; a lot of love</p>
    </article>
  </main>

  <script>
    (() => {
      const canvas = document.getElementById("fireworks");
      const ctx = canvas.getContext("2d");
      const letter = document.getElementById("letter");
      const buttons = document.querySelectorAll(".answer");
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      let width = 0;
      let height = 0;
      let particles = [];
      let lastLaunch = 0;
      let active = true;

      function resize() {
        const ratio = Math.min(window.devicePixelRatio || 1, 2);
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width * ratio;
        canvas.height = height * ratio;
        ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      }

      function burst(x, y) {
        const colors = ["#f285a2", "#ffd16f", "#b99bea", "#fff1bd", "#ffabc1"];
        const color = colors[Math.floor(Math.random() * colors.length)];
        const count = 42 + Math.floor(Math.random() * 18);
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 1.1 + Math.random() * 3.7;
          particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 45 + Math.random() * 30,
            size: 1.2 + Math.random() * 1.8,
            color
          });
        }
      }

      function animate(time) {
        if (!active) return;
        ctx.clearRect(0, 0, width, height);
        if (time - lastLaunch > 720 && particles.length < 430) {
          burst(width * (.12 + Math.random() * .76), height * (.08 + Math.random() * .42));
          lastLaunch = time;
        }
        particles = particles.filter((particle) => particle.life > 0);
        for (const particle of particles) {
          particle.x += particle.vx;
          particle.y += particle.vy;
          particle.vy += .035;
          particle.vx *= .986;
          particle.life -= 1;
          ctx.globalAlpha = Math.min(1, particle.life / 24);
          ctx.fillStyle = particle.color;
          ctx.beginPath();
          ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
        window.requestAnimationFrame(animate);
      }

      function celebrate() {
        if (letter.classList.contains("accepted")) return;
        letter.classList.add("accepted");
        burst(width * .32, height * .32);
        burst(width * .68, height * .28);
      }

      buttons.forEach((button) => button.addEventListener("click", celebrate));
      window.addEventListener("resize", resize);
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
          active = false;
        } else if (!reducedMotion && !active) {
          active = true;
          lastLaunch = performance.now();
          window.requestAnimationFrame(animate);
        }
      });

      resize();
      if (!reducedMotion) {
        window.setTimeout(() => {
          lastLaunch = performance.now();
          window.requestAnimationFrame(animate);
        }, 3300);
      }
    })();
  </script>
</body>
</html>
